<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Study Harbor · 学习港</title><link rel="stylesheet" href="/style.css"></head>
<body><header><a href="/" class="brand">◈ 学习港 <small>STUDY HARBOR</small></a><span id="connection">你的私人学习空间</span><button id="logout" hidden>退出</button></header>
<section id="login" class="login"><p class="eyebrow">YOUR LIBRARY, CONNECTED</p><h1>让阅读与思考<br>在设备之间延续。</h1><p>连接你的常开主机，查阅课程、书籍与实验记录。</p><form id="login-form"><label for="token">主机访问密钥</label><input id="token" type="password" autocomplete="current-password" required><button>进入资料库 →</button></form><p id="login-error" role="alert"></p></section>
<main id="workspace" hidden><aside><p class="eyebrow">工作空间</p><h2>我的资料库</h2><p>原文保留在你自己的主机。</p><label for="filter">文件类型</label><select id="filter"><option value="">全部资料</option><option value=".md">笔记</option><option value=".pdf">PDF 文献</option><option value=".epub">EPUB 书籍</option><option value="data">实验数据与图片</option></select><button id="scan">更新资料索引</button><p id="status" role="status"></p><a href="/api/annotations/export">导出全部批注 JSON ↗</a><p class="hint">文件同步由 Syncthing 独立运行。本页面不会修改你的 Obsidian 原文。</p></aside>
<section class="library"><div class="section-head"><div><p class="eyebrow">COLLECT · READ · CONNECT</p><h1>继续你的探索</h1></div><span id="count"></span></div><form id="search-form"><input id="query" placeholder="搜索正文，例如：实验、课程名或作者" aria-label="检索资料"><button>搜索</button><button type="button" id="clear">全部</button></form><div id="documents" class="cards"></div></section>
<section id="reader" hidden><div class="section-head"><button id="back">← 资料库</button><a id="download">打开原文件 ↗</a></div><h2 id="reader-title"></h2><p id="revision" class="hint"></p><div class="reading-tools"><label id="position-label" for="position">位置（PDF 页 / EPUB 章 / 其他阅读位置）</label><input id="position" type="number" min="1" value="1"><button id="save-progress">保存进度</button><button id="prev">上一章</button><button id="next">下一章</button></div><p id="reader-message" role="status"></p><div id="content"></div><section class="notes"><h3>阅读批注</h3><form id="note-form"><input id="quote" placeholder="引用原文（可选）" aria-label="引用原文"><textarea id="note" required placeholder="记录理解、疑问或实验观察" aria-label="批注内容"></textarea><button>保存批注</button></form><div id="notes"></div></section></section></main>
<script src="/app.js" defer></script></body></html>
