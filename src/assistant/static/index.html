<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>沈轻媞</title><link rel="stylesheet" href="/style.css"></head>
<body><header><a href="/" class="brand">沈轻媞</a><nav id="view-tabs" hidden><button id="files-tab" class="quiet">文件</button><button id="literature-tab" class="quiet">文献</button></nav><button id="logout" hidden>退出</button></header>
<section id="login" class="login"><form id="login-form"><label for="token">访问密钥</label><input id="token" type="password" autocomplete="current-password" required><button>登录</button></form><p id="login-error" role="alert"></p></section>
<main id="workspace" hidden><aside><label for="filter">文件类型</label><select id="filter"><option value="">全部资料</option><option value=".md">笔记</option><option value=".pdf">PDF 文献</option><option value=".epub">EPUB 书籍</option><option value="data">实验数据与图片</option></select><button id="scan">刷新</button><div class="tree-heading"><h3>文件树</h3><button id="trash-open" class="quiet">回收区</button></div><nav id="file-tree" aria-label="资料库文件树"></nav><p id="status" role="status"></p><a href="/api/annotations/export">导出批注</a></aside>
<section class="library"><form id="search-form"><input id="query" placeholder="搜索资料" aria-label="检索资料"><button>搜索</button><button type="button" id="clear">全部</button></form><div id="breadcrumbs" class="breadcrumbs"></div>
<div class="file-toolbar" aria-label="文件操作"><button id="new-file">＋ 新建文件</button><button id="new-folder" class="secondary">新建文件夹</button><button id="rename" class="secondary" disabled>重命名</button><button id="move" class="secondary" disabled>移动</button><button id="copy" class="secondary" disabled>复制</button><button id="delete" class="danger" disabled>删除</button></div>
<div class="list-controls"><span id="count"></span><span id="selection-info"></span><label for="sort-by">排序</label><select id="sort-by"><option value="name">名称</option><option value="created_at">创建日期</option><option value="modified_at">最近修改</option><option value="kind">类型</option><option value="size">大小</option></select><button id="sort-direction" class="quiet" aria-label="切换排序方向">升序 ↑</button></div>
<p id="file-message" role="status"></p>
<div class="table-scroll"><table class="file-table"><thead><tr><th scope="col">选择</th><th scope="col"><button data-sort="name">名称</button></th><th scope="col"><button data-sort="kind">类型</button></th><th scope="col"><button data-sort="size">大小</button></th><th scope="col"><button data-sort="created_at">创建日期</button></th><th scope="col"><button data-sort="modified_at">最近修改</button></th></tr></thead><tbody id="documents"></tbody></table></div>
</section>
<section id="reader" hidden><div class="section-head"><button id="back">← 资料库</button><a id="download">原文件</a></div><h2 id="reader-title"></h2><div class="reading-tools"><label id="position-label" for="position">阅读位置</label><input id="position" type="number" min="1" value="1"><button id="save-progress">保存进度</button><button id="prev">上一章</button><button id="next">下一章</button></div><p id="reader-message" role="status"></p><div id="content"></div><section class="notes"><h3>阅读批注</h3><form id="note-form"><input id="quote" placeholder="引用原文（可选）" aria-label="引用原文"><textarea id="note" required placeholder="批注" aria-label="批注内容"></textarea><button>保存批注</button></form><div id="notes"></div></section></section>
<section id="literature-view" hidden>
<div class="lit-header"><h2>文献</h2><button id="lit-settings-open" class="secondary">模型与规则</button></div>
<form id="lit-start-form" class="lit-start"><label for="lit-source">原文</label><select id="lit-source" required></select><label for="lit-topic">主题</label><input id="lit-topic" placeholder="例如：原位结构生物学" maxlength="120" required list="lit-topics"><datalist id="lit-topics"></datalist><label for="lit-purpose">阅读目的</label><input id="lit-purpose" placeholder="全文阅读（可选侧重点）" maxlength="2000"><button id="lit-start">生成全文初稿</button></form>
<p id="lit-state" role="status"></p><details id="lit-metadata-wrap" hidden><summary>原文信息</summary><div id="lit-metadata"></div></details>
<div class="lit-list-tools"><label for="lit-topic-filter">主题</label><select id="lit-topic-filter"><option value="">全部</option></select><button id="lit-refresh" class="quiet">刷新</button></div>
<div class="table-scroll"><table class="literature-table"><thead><tr><th>作者信息</th><th>背景、目的以及意义</th><th>主要方法及结果</th><th>讨论</th><th>想法</th></tr></thead><tbody id="lit-jobs"></tbody></table></div>
<section id="lit-study" hidden><div class="lit-header"><h3 id="lit-study-title"></h3><button id="lit-study-close" class="quiet">收起</button></div><label for="lit-section">按原文小标题阅读</label><select id="lit-section"></select><div class="lit-study-grid"><article><h4>原文</h4><pre id="lit-section-source"></pre></article><article><h4>阅读笔记 · 待核对</h4><div id="lit-section-analysis"></div></article></div><form id="lit-question-form"><input id="lit-question" placeholder="针对本节提问" maxlength="4000" required aria-label="本节问题"><button>提问</button></form><div id="lit-answers"></div></section>
</section></main>
<dialog id="file-dialog"><form id="file-form"><h2 id="dialog-title"></h2><p id="dialog-description"></p><div id="destination-field"><label for="destination">目标文件夹</label><select id="destination"></select></div><div id="name-field"><label for="entry-name">名称</label><input id="entry-name" maxlength="255" required autocomplete="off"></div><div id="text-field" hidden><label for="entry-content">初始内容（可选）</label><textarea id="entry-content"></textarea></div><p id="dialog-error" role="alert"></p><div class="dialog-actions"><button type="button" id="dialog-cancel" class="secondary">取消</button><button id="dialog-submit">确认</button></div></form></dialog>
<dialog id="trash-dialog"><div class="section-head"><h2>回收区</h2><button id="trash-close" class="quiet">关闭</button></div><p class="hint">恢复到原路径，不会覆盖现有文件。缺少父目录时，请先恢复或创建父目录。</p><div id="trash-list"></div><p id="trash-error" role="alert"></p></dialog>
<dialog id="lit-settings-dialog"><form id="lit-settings-form"><h2>模型</h2><label for="lit-provider">服务商</label><select id="lit-provider"><option value="openai">OpenAI</option><option value="deepseek">DeepSeek</option><option value="kimi">Kimi</option><option value="compatible">其他兼容服务</option></select><label for="lit-model">模型名称</label><input id="lit-model" placeholder="填写账号可用的模型名称" maxlength="200" required><details><summary>接口设置</summary><label for="lit-base">服务地址</label><input id="lit-base" type="url"><label for="lit-api-mode">接口类型</label><select id="lit-api-mode"><option value="responses">Responses</option><option value="chat">Chat Completions</option></select><label for="lit-max-output">单次输出上限</label><input id="lit-max-output" type="number" min="1000" max="16000"><label class="checkbox-label"><input type="checkbox" id="lit-json-mode">请求 JSON 模式</label></details><p id="lit-key-status" class="hint"></p><p id="lit-settings-error" role="alert"></p><div class="dialog-actions"><button type="button" id="lit-settings-close" class="secondary">关闭</button><button>保存模型设置</button></div></form><hr><details><summary id="lit-rule-title">阅读规则</summary><label for="lit-rules">用于今后文献阅读的纠正与偏好</label><textarea id="lit-rules" maxlength="10000" placeholder="例如：讨论中单列样本量与关键对照的局限。"></textarea><button type="button" id="lit-save-rules">保存并用于今后阅读</button><p id="lit-rule-message" role="status"></p></details></dialog>
<dialog id="lit-notes-dialog"><h2>保存笔记</h2><p id="lit-notes-path" class="hint"></p><label for="lit-ideas">我的想法</label><textarea id="lit-ideas" maxlength="50000" placeholder="留给你填写；助手建议单独保存在讨论中。"></textarea><details><summary>详细笔记初稿</summary><pre id="lit-note-preview"></pre></details><p id="lit-notes-message" role="status"></p><div class="dialog-actions"><a id="lit-download" class="quiet">下载 Markdown</a><button id="lit-notes-close" class="secondary">关闭</button><button id="lit-save-notes">保存并提交个人 Git</button></div></dialog>
<script src="/app.js" defer></script><script src="/literature.js" defer></script></body></html>
