[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-study-assistant"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pypdf>=5,<7", "markdown-it-py>=3,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
assistant = ["static/*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
